name: Refresh and publish market snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test aggregation
        run: python3 -m unittest discover -s tests -v
      - name: Collect complete fresh public data on the server
        run: python3 scripts/collect.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the uploaded artifact to become visible to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "Uploaded Pages artifact did not become visible within two minutes."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
